<script type="text/html" data-template-name="ratio">
  <div class="form-row">
    <label for="node-input-name">Name</label>
    <input type="text" id="node-input-name" placeholder="event name" />
  </div>
  <div class="form-row">
    <label for="node-input-filename">File Path</label>
    <input type="text" id="node-input-filename" placeholder="directory path" />
  </div>
  <div class="form-row">
    <label for="node-input-format">Format</label>
    <input type="text" id="node-input-format" placeholder="utf8" />
  </div>
</script>

<script type="text/javascript">
  RED.nodes.registerType("ratio", {
    category: "etl",
    defaults: {
      name: { value: "" },
      filename: { value: "" },
      format: { value: "utf8" },
      chunk: { value: false },
      sendError: { value: false },
      encoding: { value: "none" },
    },
    color: "#F1F6F9",
    inputs: 1,
    outputs: 1,
    label: function () {
      return this.name || "";
    },
    labelStyle: function () {
      return this.name ? "node_label_italic" : "";
    },
  });
</script>
