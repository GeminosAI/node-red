<script type="text/html" data-template-name="entity">
  <div class="form-row">
    <label for="node-input-name">Name</label>
    <input type="text" id="node-input-name" placeholder="event name" />
  </div>
  <div class="form-row node-input-property-container-row">
    <ol id="node-input-property-container"></ol>
  </div>
</script>

<script type="text/javascript">
  function resizeDialog(size) {
    size = size || { height: $(".red-ui-tray-content form").height() };
    var rows = $(
      "#dialog-form>div:not(.node-input-property-container-row):visible"
    );
    var height = size.height;
    for (var i = 0; i < rows.length; i++) {
      height -= $(rows[i]).outerHeight(true);
    }
    var editorRow = $("#dialog-form>div.node-input-property-container-row");
    height -=
      parseInt(editorRow.css("marginTop")) +
      parseInt(editorRow.css("marginBottom"));
    height += 16;
    $("#node-input-property-container").editableList("height", height);
  }
  RED.nodes.registerType("entity", {
    category: "knowledge",
    defaults: {
      name: { value: "" },
      props: { value: [{ p: "payload" }, { p: "topic", vt: "str" }] },
    },
    color: "#FFEEB2",
    icon: "font-awesome/fa-tree",
    inputs: 1,
    outputs: 1,
    label: function () {
      return this.name || "";
    },
    labelStyle: function () {
      return this.name ? "node_label_italic" : "";
    },
    oneditprepare: function () {
      $("#node-input-property-container")
        .css("min-height", "120px")
        .css("min-width", "450px")
        .editableList({
          addItem: function (container, i, opt) {
            var prop = opt;
            if (!prop.hasOwnProperty("p")) {
              prop = { p: "", v: "", vt: "str" };
            }
            container.css({
              overflow: "hidden",
              whiteSpace: "nowrap",
            });
            var row = $("<div/>").appendTo(container);

            var propertyName = $("<input/>", {
              class: "node-input-prop-property-name",
              style: "display:inline-block; padding: 0px 6px",
            })
              .css("width", "35%")
              .appendTo(row)
              .typedInput({
                default: "str",
              });

            $("<div/>", { style: "display:inline-block; padding:0px 6px;" })
              .text("=")
              .appendTo(row);

            var propertyValue = $("<input/>", {
              class: "node-input-prop-property-value",
              type: "text",
            })
              .css("width", "calc(70% - 35px)")
              .appendTo(row)
              .typedInput({
                default: "str",
                types: [
                  "msg",
                  "flow",
                  "global",
                  "str",
                  "num",
                  "bool",
                  "json",
                  "bin",
                  "date",
                  "jsonata",
                  "env",
                ],
              });

            propertyName.typedInput("value", prop.p);
            propertyValue.typedInput("value", prop.v);
            propertyValue.typedInput("type", prop.vt);
          },
          removable: true,
          sortable: true,
        });

      if (!this.props) {
        var payload = {
          p: "payload",
          v: this.payload ? this.payload : "",
          vt: this.payloadType ? this.payloadType : "date",
        };
        var topic = {
          p: "topic",
          v: this.topic ? this.topic : "",
          vt: "string",
        };
        this.props = [payload, topic];
      }

      for (var i = 0; i < this.props.length; i++) {
        var prop = this.props[i];
        var newProp = { p: prop.p, v: prop.v, vt: prop.vt };
        if (newProp.v === undefined) {
          if (prop.p === "payload") {
            newProp.v = this.payload ? this.payload : "";
            newProp.vt = this.payloadType ? this.payloadType : "date";
          } else if (prop.p === "topic" && prop.vt === "str") {
            newProp.v = this.topic ? this.topic : "";
          }
        }
        $("#node-input-property-container").editableList("addItem", newProp);
      }
    },
    oneditsave: function () {
      var props = $("#node-input-property-container").editableList("items");
      var node = this;
      node.props = [];
      delete node.payloadType;
      delete node.payload;
      node.topic = "";
      props.each(function (i) {
        var prop = $(this);
        var p = {
          p: prop.find(".node-input-prop-property-name").typedInput("value"),
        };
        if (p.p) {
          p.v = prop
            .find(".node-input-prop-property-value")
            .typedInput("value");
          p.vt = prop
            .find(".node-input-prop-property-value")
            .typedInput("type");
          if (p.p === "payload") {
            // save payload to old "legacy" property
            node.payloadType = p.vt;
            node.payload = p.v;
            delete p.v;
            delete p.vt;
          } else if (p.p === "topic" && p.vt === "str") {
            node.topic = p.v;
            delete p.v;
          }
          node.props.push(p);
        }
      });
    },
    oneditresize: resizeDialog,
  });
</script>
